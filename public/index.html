<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Insurance Buzzz - Compare</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:Arial,sans-serif;background:#f8f9fa;color:#333}
header{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;padding:18px 0}
.container{max-width:1200px;margin:0 auto;padding:0 20px}.header-content{display:flex;justify-content:space-between;align-items:center}
.logo{font-size:24px;font-weight:bold}nav a{color:#fff;text-decoration:none;margin-left:15px}
.hero{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;padding:45px 0;text-align:center}
.search-box{background:#fff;padding:15px;border-radius:8px;max-width:420px;margin:20px auto;display:flex;gap:8px}
.search-box select{flex:1;padding:10px;border:1px solid #ddd;border-radius:5px}
.search-box button{padding:10px 18px;background:#667eea;color:#fff;border:none;border-radius:5px;cursor:pointer;font-weight:bold}
.policies-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;padding:35px 0}
.policy-card{background:#fff;padding:20px;border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.08);border:2px solid transparent}
.policy-card.selected{border-color:#667eea;background:#f5f3ff}
.premium{color:#667eea;font-weight:800;font-size:20px;margin:8px 0}
.btn{width:100%;padding:10px;border:none;border-radius:6px;cursor:pointer;margin-top:7px;font-weight:700}
.btn-primary{background:#667eea;color:#fff}.btn-compare{background:#fff;color:#764ba2;border:2px solid #764ba2}.btn-compare.active{background:#27ae60;color:#fff;border-color:#27ae60}
#compare-bar{display:none;position:fixed;bottom:15px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:12px 18px;border-radius:30px;z-index:9999;gap:10px;align-items:center;box-shadow:0 4px 15px rgba(0,0,0,.3)}
#compare-modal,#quote-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:10000;padding:20px;overflow:auto}
.modal-box{background:#fff;max-width:900px;margin:30px auto;padding:20px;border-radius:12px}
.compare-table{width:100%;border-collapse:collapse}.compare-table th,.compare-table td{border:1px solid #ddd;padding:10px;text-align:left}
</style></head><body>
<header><div class="container"><div class="header-content"><div class="logo">Insurance Buzzz</div><nav><a href="#policies">Browse Policies</a><a href="/admin">Admin</a></nav></div></div></header>
<section class="hero"><div class="container"><h1>Find Your Perfect Insurance</h1><p>Compare policies from top companies</p><div class="search-box"><select id="typeFilter"><option value="">All Types</option><option value="Health">Health Insurance</option><option value="Motor">Motor Insurance</option><option value="Home">Home Insurance</option><option value="Travel">Travel Insurance</option><option value="Commercial">Commercial</option></select><button onclick="filterPolicies()">Search</button></div></div></section>
<div class="container"><div id="policiesContainer" class="policies-grid">Loading policies...</div></div>
<div id="compare-bar"><span id="compare-count"></span><button onclick="showCompare()" style="background:#667eea;color:#fff;border:none;padding:6px 14px;border-radius:20px;cursor:pointer;font-weight:bold;">Compare Now</button><button onclick="clearCompare()" style="background:none;border:none;color:#aaa;cursor:pointer;margin-left:8px;">✕</button></div>
<div id="compare-modal" onclick="if(event.target.id=='compare-modal')this.style.display='none'"><div class="modal-box"><div style="display:flex;justify-content:space-between;align-items:center;"><h2>Compare Policies</h2><button onclick="document.getElementById('compare-modal').style.display='none'" style="border:none;padding:6px 12px;border-radius:50%;cursor:pointer;">✕</button></div><div id="compare-table" style="margin-top:15px;"></div></div></div>
<div id="quote-modal" onclick="if(event.target.id=='quote-modal')this.style.display='none'"><div class="modal-box" style="max-width:450px;"><h2>Get Quote</h2><p id="quote-policy-name" style="color:#667eea;font-weight:bold;margin:8px 0;"></p><input id="qname" placeholder="Your Name *" style="width:100%;padding:10px;margin:6px 0;border:1px solid #ddd;border-radius:5px;"><input id="qphone" placeholder="Phone *" style="width:100%;padding:10px;margin:6px 0;border:1px solid #ddd;border-radius:5px;"><input id="qemail" placeholder="Email" style="width:100%;padding:10px;margin:6px 0;border:1px solid #ddd;border-radius:5px;"><textarea id="qmsg" placeholder="Message" style="width:100%;padding:10px;margin:6px 0;border:1px solid #ddd;border-radius:5px;"></textarea><button class="btn btn-primary" onclick="submitQuote()">Submit Quote</button><button class="btn" style="background:#eee;" onclick="document.getElementById('quote-modal').style.display='none'">Cancel</button></div></div>
<script>
let masterPolicies=[],allPolicies=[],selectedIds=JSON.parse(localStorage.getItem('compareIds')||'[]');let currentQuote=null;
async function loadPolicies(){const r=await fetch('/api/policies');masterPolicies=await r.json();allPolicies=[...masterPolicies];displayPolicies(allPolicies);updateBar();}
async function filterPolicies(){const t=document.getElementById('typeFilter').value;if(!t){allPolicies=[...masterPolicies];}else{const r=await fetch('/api/search?type='+t);allPolicies=await r.json();}displayPolicies(allPolicies);}
function displayPolicies(list){const c=document.getElementById('policiesContainer');if(!list.length){c.innerHTML='<p>No policies found</p>';return;}c.innerHTML=list.map(p=>{const pid=(p._id||p.id).toString();const sel=selectedIds.includes(pid);return `<div class="policy-card ${sel?'selected':''}"><h3>${p.name}</h3><div style="color:#764ba2;font-weight:bold;font-size:13px;">${p.type} • ${p.company}</div><div style="margin:4px 0;">Rating: ${p.rating} ⭐</div><div class="premium">${p.premium}</div><p style="font-size:13px;color:#666;">${p.coverage}</p><ul style="margin:8px 0 0 18px;font-size:13px;">${(p.features||[]).slice(0,4).map(f=>`<li>${f}</li>`).join('')}</ul><button class="btn btn-primary" onclick="openQuote('${pid}')">Get Quote</button><button class="btn btn-compare ${sel?'active':''}" onclick="toggleCompare('${pid}')">${sel?'✓ Selected - Click to Remove':'＋ Add to Compare'}</button></div>`}).join('');}
function toggleCompare(id){id=id.toString();if(selectedIds.includes(id)){selectedIds=selectedIds.filter(x=>x!==id);}else{if(selectedIds.length>=3){alert('Max 3 policies can be compared');return;}selectedIds.push(id);}localStorage.setItem('compareIds',JSON.stringify(selectedIds));displayPolicies(allPolicies);updateBar();}
function updateBar(){const b=document.getElementById('compare-bar');const cnt=document.getElementById('compare-count');if(selectedIds.length>0){b.style.display='flex';cnt.innerText=selectedIds.length+' selected';}else b.style.display='none';}
function clearCompare(){selectedIds=[];localStorage.removeItem('compareIds');displayPolicies(allPolicies);updateBar();}
function showCompare(){if(selectedIds.length<2){alert('Please select at least 2 policies');return;}const items=masterPolicies.filter(p=>selectedIds.includes((p._id||p.id).toString()));if(!items.length){alert('Please reload page');return;}let h='<table class="compare-table"><tr><th>Feature</th>'+items.map(p=>`<th>${p.name}</th>`).join('')+'</tr>';const rows=[['Type',items.map(i=>i.type)],['Company',items.map(i=>i.company)],['Premium',items.map(i=>i.premium)],['Coverage',items.map(i=>i.coverage)],['Rating',items.map(i=>i.rating)],['Features',items.map(i=>(i.features||[]).join(', '))]];rows.forEach(r=>{h+=`<tr><td><b>${r[0]}</b></td>`+r[1].map(v=>`<td>${v}</td>`).join('')+'</tr>'});h+='</table>';document.getElementById('compare-table').innerHTML=h;document.getElementById('compare-modal').style.display='block';}
function openQuote(id){currentQuote=masterPolicies.find(p=>(p._id||p.id).toString()==id);document.getElementById('quote-policy-name').innerText=currentQuote?currentQuote.name:'';document.getElementById('quote-modal').style.display='block';}
async function submitQuote(){const name=document.getElementById('qname').value;const phone=document.getElementById('qphone').value;if(!name||!phone){alert('Name and Phone required');return;}const data={policyId:currentQuote?._id||currentQuote?.id,policyName:currentQuote?.name,name,email:document.getElementById('qemail').value,phone,message:document.getElementById('qmsg').value};const r=await fetch('/api/quotes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});if(r.ok){alert('Quote submitted! We will contact you at 9953558483');document.getElementById('quote-modal').style.display='none';}else alert('Failed');}
loadPolicies();
</script>
</body></html>
