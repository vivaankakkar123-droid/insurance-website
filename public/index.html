<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Insurance Buzzz</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:Arial,sans-serif;background:#f8f9fa}
header{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;padding:16px 0;position:sticky;top:0;z-index:100}
.container{max-width:1200px;margin:0 auto;padding:0 16px}.header-content{display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:bold;font-size:22px}nav a{color:#fff;text-decoration:none;margin-left:12px}
.hero{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;padding:35px 0;text-align:center}
.search-box{background:#fff;padding:10px;border-radius:8px;max-width:360px;margin:18px auto}
.policies-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;padding:28px 0}
.policy-card{background:#fff;padding:16px;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.08);border:2px solid #eee;transition:.2s}
.policy-card.selected{border-color:#667eea;background:#f0eeff;transform:translateY(-2px)}
.premium{color:#667eea;font-weight:800;font-size:18px;margin:6px 0}
.btn{width:100%;padding:10px;border:none;border-radius:6px;cursor:pointer;margin-top:6px;font-weight:700}
.btn-primary{background:#667eea;color:#fff}.btn-compare{background:#fff;color:#764ba2;border:2px solid #764ba2}
.btn-compare.active{background:#27ae60;color:#fff;border-color:#27ae60}
#compare-bar{display:none;position:fixed;bottom:12px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:30px;z-index:999;gap:12px;align-items:center;box-shadow:0 5px 20px rgba(0,0,0,.3)}
#compare-modal,#quote-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:1000;overflow:auto;padding:16px}
.modal-box{background:#fff;max-width:900px;margin:40px auto;padding:20px;border-radius:12px}
.compare-table{width:100%;border-collapse:collapse;margin-top:12px}.compare-table th,.compare-table td{border:1px solid #ddd;padding:8px;text-align:left;font-size:14px}
</style></head><body>
<header><div class="container"><div class="header-content"><div class="logo">Insurance Buzzz</div><nav><a href="#policies">Policies</a><a href="/admin">Admin</a></nav></div></div></header>
<section class="hero"><div class="container"><h1>Compare & Save on Insurance</h1><div class="search-box"><select id="typeFilter" onchange="filterPolicies()"><option value="">All Types</option><option>Health</option><option>Motor</option><option>Home</option><option>Travel</option><option>Commercial</option></select></div></div></section>
<div class="container"><div id="policiesContainer" class="policies-grid">Loading policies...</div></div>
<div id="compare-bar"><span id="compare-count">0 selected</span><button onclick="showCompare()" style="background:#667eea;color:#fff;border:none;padding:7px 14px;border-radius:20px;font-weight:700;cursor:pointer;">Compare Now</button><button onclick="clearCompare()" style="background:transparent;border:none;color:#bbb;cursor:pointer;">✕ Clear</button></div>
<div id="compare-modal"><div class="modal-box"><div style="display:flex;justify-content:space-between;align-items:center"><h2>Compare Policies</h2><button onclick="document.getElementById('compare-modal').style.display='none'" style="padding:6px 12px;border-radius:50%;border:none;cursor:pointer">✕</button></div><div id="compare-table"></div></div></div>
<div id="quote-modal"><div class="modal-box" style="max-width:450px"><h2>Get Quote</h2><p id="quote-policy-name" style="color:#667eea;font-weight:bold;margin:6px 0"></p><input id="qname" placeholder="Your Name" style="width:100%;padding:10px;margin:5px 0;border:1px solid #ddd;border-radius:6px"><input id="qphone" placeholder="Phone *" style="width:100%;padding:10px;margin:5px 0;border:1px solid #ddd;border-radius:6px"><input id="qemail" placeholder="Email" style="width:100%;padding:10px;margin:5px 0;border:1px solid #ddd;border-radius:6px"><textarea id="qmsg" placeholder="Message" style="width:100%;padding:10px;margin:5px 0;border:1px solid #ddd;border-radius:6px"></textarea><button class="btn btn-primary" onclick="submitQuote()">Submit</button><button class="btn" style="background:#eee" onclick="document.getElementById('quote-modal').style.display='none'">Cancel</button></div></div>
<script>
let masterPolicies=[], displayList=[], selectedIds=JSON.parse(localStorage.getItem('compareIds')||'[]');
let currentQuote=null;
async function loadPolicies(){const r=await fetch('/api/policies');masterPolicies=await r.json();displayList=[...masterPolicies];render(displayList);updateBar();}
async function filterPolicies(){const t=document.getElementById('typeFilter').value;if(!t){displayList=[...masterPolicies];}else{const r=await fetch('/api/search?type='+t);displayList=await r.json();}render(displayList);}
function render(list){const c=document.getElementById('policiesContainer');if(!list.length){c.innerHTML='<p>No policies</p>';return}c.innerHTML=list.map(p=>{const id=(p._id||p.id).toString();const sel=selectedIds.includes(id);return `<div class="policy-card ${sel?'selected':''}"><h3>${p.name}</h3><div style="color:#764ba2;font-weight:700;font-size:13px">${p.type} • ${p.company}</div><div style="margin:4px 0">⭐ ${p.rating}</div><div class="premium">${p.premium}</div><div style="font-size:13px;color:#555">${p.coverage}</div><ul style="margin:8px 0 0 18px;font-size:13px">${(p.features||[]).slice(0,3).map(f=>`<li>${f}</li>`).join('')}</ul><button class="btn btn-primary" onclick="openQuote('${id}')">Get Quote</button><button class="btn btn-compare ${sel?'active':''}" onclick="toggleCompare('${id}')">${sel?'✓ Remove from Compare':'＋ Add to Compare'}</button></div>`}).join('');}
function toggleCompare(id){id=id.toString();if(selectedIds.includes(id)){selectedIds=selectedIds.filter(x=>x!==id);}else{if(selectedIds.length>=3){alert('You can compare max 3');return;}selectedIds.push(id);}localStorage.setItem('compareIds',JSON.stringify(selectedIds));render(displayList);updateBar();}
function updateBar(){const bar=document.getElementById('compare-bar');const cnt=document.getElementById('compare-count');if(selectedIds.length>0){bar.style.display='flex';cnt.innerText=selectedIds.length+' selected';}else{bar.style.display='none';}}
function clearCompare(){selectedIds=[];localStorage.removeItem('compareIds');render(displayList);updateBar();}
function showCompare(){if(selectedIds.length<2){alert('Select atleast 2');return;}const items=masterPolicies.filter(p=>selectedIds.includes((p._id||p.id).toString()));if(!items.length){alert('Error: reload page');return;}let html='<table class="compare-table"><tr><th>Feature</th>'+items.map(p=>`<th>${p.name}</th>`).join('')+'</tr>';const rows=[['Type',items.map(i=>i.type)],['Company',items.map(i=>i.company)],['Premium',items.map(i=>`<b style="color:#667eea">${i.premium}</b>`)],['Coverage',items.map(i=>i.coverage)],['Rating',items.map(i=>i.rating+' ⭐')],['Features',items.map(i=>(i.features||[]).join('<br>'))]];rows.forEach(r=>{html+=`<tr><td><b>${r[0]}</b></td>`+r[1].map(v=>`<td>${v}</td>`).join('')+'</tr>'});html+='</table>';document.getElementById('compare-table').innerHTML=html;document.getElementById('compare-modal').style.display='block';}
function openQuote(id){currentQuote=masterPolicies.find(p=>(p._id||p.id).toString()==id);document.getElementById('quote-policy-name').innerText=currentQuote?currentQuote.name:'';document.getElementById('quote-modal').style.display='block';}
async function submitQuote(){const name=document.getElementById('qname').value;const phone=document.getElementById('qphone').value;if(!name||!phone){alert('Name & Phone required');return;}const payload={policyId:currentQuote?._id||currentQuote?.id,policyName:currentQuote?.name,name,email:document.getElementById('qemail').value,phone,message:document.getElementById('qmsg').value};const r=await fetch('/api/quotes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});if(r.ok){alert('Quote submitted! We will call you soon: 9953558483');document.getElementById('quote-modal').style.display='none';}else{alert('Failed to submit');}}
loadPolicies();
document.getElementById('compare-modal').addEventListener('click',e=>{if(e.target.id==='compare-modal')e.target.style.display='none'});
document.getElementById('quote-modal').addEventListener('click',e=>{if(e.target.id==='quote-modal')e.target.style.display='none'});
</script></body></html>
