<!DOCTYPE html>
<html>
<head><title>Admin Panel</title>
<style>body{font-family:sans-serif;max-width:800px;margin:50px auto;padding:20px}input,button{padding:10px;margin:5px;width:100%}#adminPanel{display:none}</style>
</head>
<body>
<div id="loginBox">
<h2>Admin Login</h2>
<input type="password" id="adminPass" placeholder="Password">
<button onclick="login()">Login</button>
<p id="err" style="color:red"></p>
</div>

<div id="adminPanel">
<h2>Policy Manager</h2>
<input id="pname" placeholder="Policy Name">
<input id="pcompany" placeholder="Company">
<input id="ptype" placeholder="Type - Health, Life">
<input id="ppremium" placeholder="Premium">
<input id="pcoverage" placeholder="Coverage">
<input id="prating" placeholder="Rating 4.5">
<input id="pfeatures" placeholder="Features comma separated">
<button onclick="addPolicy()">Add Policy</button>
<hr>
<div id="list"></div>
<hr>
<h3>Quotes</h3>
<div id="quotes"></div>
</div>

<script>
const API='https://insurance-website-1-6a9d.onrender.com';
const ADMIN_PASS='admin123';

function login(){
 const p=document.getElementById('adminPass').value;
 if(p===ADMIN_PASS){
  document.getElementById('loginBox').style.display='none';
  document.getElementById('adminPanel').style.display='block';
  loadAll();
 } else {
  document.getElementById('err').innerText='Wrong password, try admin123';
 }
}
async function loadAll(){
 try{
  let r=await fetch(API+'/api/policies'); let d=await r.json();
  document.getElementById('list').innerHTML=d.map(x=>`<div>${x.name} - ${x.company} <button onclick="delPolicy('${x._id}')">Delete</button></div>`).join('');
  let q=await fetch(API+'/api/quotes'); let qd=await q.json();
  document.getElementById('quotes').innerHTML=qd.map(x=>`<div>${x.name} ${x.phone} ${x.email}</div>`).join('');
 }catch(e){document.getElementById('list').innerHTML='Backend waking up... 30 sec wait';}
}
async function addPolicy(){
 const body={name:pname.value,company:pcompany.value,type:ptype.value,premium:ppremium.value,coverage:pcoverage.value,rating:prating.value,features:pfeatures.value.split(',')};
 await fetch(API+'/api/policies',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
 alert('Added'); loadAll();
}
async function delPolicy(id){await fetch(API+'/api/policies/'+id,{method:'DELETE'}); loadAll();}
</script>
</body>
</html>
